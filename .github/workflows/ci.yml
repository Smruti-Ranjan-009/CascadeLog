name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cascadelog-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container starts and /health responds
        run: |
          docker run -d --name cascadelog-ci \
            -p 8000:8000 \
            -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            cascadelog-backend:ci

          # Give the container time to finish loading the embedding model
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done

          echo "Backend failed to become healthy in time"
          docker logs cascadelog-ci
          exit 1

      - name: Dump container logs (always, for debugging)
        if: always()
        run: docker logs cascadelog-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f cascadelog-ci || true

  frontend:
    name: Frontend — install & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
